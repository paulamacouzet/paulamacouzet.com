<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/Logo_weddings.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inquire | Paula Macouzet</title>
    
    <!-- Open Graph Meta Tags for Social/WhatsApp Sharing -->
    <meta property="og:title" content="Inquire | Paula Macouzet" />
    <meta property="og:description" content="Get in touch to design the visual identity of your destination wedding." />
    <meta property="og:image" content="https://paulamacouzet.com/images/Hero_image_weddings_page.png" />
    <meta property="og:url" content="https://paulamacouzet.com/weddings/inquire/" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css" />
    <style>
      .inquire-page {
        min-height: calc(100vh - 80px - 100px); /* Adjust for header and footer */
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 4rem 2rem 8rem 2rem;
        background-color: var(--color-bg);
      }
      
      .inquire-header {
        text-align: center;
        margin-bottom: 4rem;
      }
      
      .inquire-header h1 {
        font-family: 'Cinzel', serif;
        font-size: 3rem;
        font-weight: 400;
        margin-bottom: 1rem;
        color: #4a4a4a;
      }
      
      .inquire-header p {
        font-family: var(--font-body);
        font-size: 1.1rem;
        color: #8d8880;
        font-weight: 300;
      }
    </style>
  </head>
  <body>
      <header class="main-header">
        <div class="nav-left">
          <a href="/" class="brand-link">
            <img src="/images/logo_paulamacouzet.png" alt="Paula Macouzet" class="brand-logo">
          </a>
          <nav class="nav-links">
            <a href="/weddings/#about">about</a>
            <a href="/weddings/#philosophy">philosophy</a>
          </nav>
        </div>
        
        <div class="nav-center">
          <a href="/weddings/" class="center-logo-link">
            <img src="/images/Logo_weddings.png" alt="Wedding Identity Logo" class="center-logo">
          </a>
        </div>
        
        <div class="nav-right">
          <nav class="nav-links">
            <a href="/weddings/stories/">stories</a>
            <a href="/weddings/collections/">collections</a>
            <a href="/weddings/for-planners/">for planners</a>
            <a href="/weddings/inquire/" class="active-link">inquire</a>
          </nav>
        </div>
        
        <!-- Mobile Nav Toggle (Hidden on Desktop) -->
        <button class="mobile-nav-toggle" id="mobile-nav-toggle" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" class="hamburger-icon">
            <line x1="3" y1="12" x2="21" y2="12" class="line-middle"></line>
            <line x1="3" y1="6" x2="21" y2="6" class="line-top"></line>
            <line x1="3" y1="18" x2="21" y2="18" class="line-bottom"></line>
          </svg>
        </button>
        
        <!-- Fullscreen Mobile Menu Overlay -->
        <div id="mobile-menu" class="mobile-menu-overlay">
          <nav class="mobile-nav-links">
            <a href="/weddings/#about">about</a>
            <a href="/weddings/#philosophy">philosophy</a>
            <a href="/weddings/stories/">stories</a>
            <a href="/weddings/collections/">collections</a>
            <a href="/weddings/for-planners/">for planners</a>
            <a href="/weddings/inquire/">inquire</a>
          </nav>
        </div>
      </header>
      
      <main class="inquire-page">
        <div class="inquire-header">
          <h1>Inquire</h1>
          <p>Tell us about your story and your wedding vision.</p>
        </div>

        <form class="inquire-form-container" action="https://formspree.io/f/maenwzke" method="POST">
          <!-- Formspree redirect to custom thank you page -->
          <input type="hidden" name="_next" value="https://paulamacouzet.com/weddings/thank-you/">
          
          <div class="form-group">
            <input type="text" name="name" class="minimal-input" placeholder="Full Name *" required>
          </div>
          
          <div class="form-group">
            <input type="email" name="email" class="minimal-input" placeholder="Email Address *" required>
          </div>

          <div class="form-group">
            <select name="collection_interest" id="collection-select" class="minimal-input" required>
              <option value="" disabled selected>Select Collection of Interest *</option>
              <option value="signature">Collection II: The Signature Identity ($2,600 USD) — Signature</option>
              <option value="digital">Collection I: The Digital Suite ($1,600 USD)</option>
              <option value="atelier">Collection III: The Full Atelier ($3,600 USD)</option>
              <option value="custom">Undecided / Bespoke Atelier Commission</option>
            </select>
          </div>

          <div class="form-group">
            <select name="budget_range" id="budget-select" class="minimal-input" required>
              <option value="" disabled selected>Estimated Design & Web Budget *</option>
              <option value="1600-2500">$1,600 – $2,500 USD</option>
              <option value="2500-3500">$2,600 – $3,500 USD</option>
              <option value="3500-5000">$3,600 – $5,000+ USD</option>
              <option value="flexible">Flexible / Seeking Guidance</option>
            </select>
          </div>
          
          <div class="form-group">
            <input type="text" name="wedding_date" class="minimal-input" placeholder="Wedding Date (if known)">
          </div>
          
          <div class="form-group">
            <input type="text" name="wedding_location" class="minimal-input" placeholder="Wedding Location / Venue">
          </div>
          
          <div class="form-group">
            <input type="text" name="wedding_planner" id="planner-input" class="minimal-input" placeholder="Do you have a wedding planner? If so, who?">
          </div>

          <div class="form-group" style="margin-top: -0.5rem; margin-bottom: 1.5rem;">
            <label style="display: flex; align-items: center; gap: 0.6rem; font-size: 0.85rem; color: #797166; cursor: pointer;">
              <input type="checkbox" name="is_wedding_planner" id="planner-checkbox" value="yes" style="accent-color: #b89d74; width: 16px; height: 16px;">
              <span>I am a Wedding Planner inquiring on behalf of a client</span>
            </label>
          </div>
          
          <div class="form-group">
            <textarea name="vision" class="minimal-input" placeholder="Tell us about your wedding vision, your roots, and what you're looking for... *" required></textarea>
          </div>
          
          <button type="submit" class="submit-btn">Send Inquiry</button>
        </form>
        
        <div style="margin-top: 3rem; text-align: center;">
          <p style="font-family: var(--font-body); font-style: italic; color: var(--color-text); opacity: 0.8; font-weight: 300;">or send me an email: <a href="mailto:paulamacouzet@gmail.com" style="color: var(--color-text); text-decoration: none;">paulamacouzet@gmail.com</a></p>
        </div>
      </main>

      <footer class="main-footer">
        <div class="footer-content">
          <a href="/">
            <img src="/images/logo_paulamacouzet.png" alt="Paula Macouzet" class="footer-logo">
          </a>
          <p class="copyright">&copy; 2026 Paula Macouzet. All rights reserved.</p>
        </div>
      </footer>
    
    <script>
      // Hamburger Menu Logic
      const navToggle = document.getElementById('mobile-nav-toggle');
      const mobileMenu = document.getElementById('mobile-menu');
      
      if (navToggle && mobileMenu) {
        navToggle.addEventListener('click', () => {
          navToggle.classList.toggle('is-active');
          mobileMenu.classList.toggle('is-open');
          document.body.classList.toggle('menu-open');
        });
        
        const mobileLinks = mobileMenu.querySelectorAll('a');
        mobileLinks.forEach(link => {
          link.addEventListener('click', () => {
            navToggle.classList.remove('is-active');
            mobileMenu.classList.remove('is-open');
            document.body.classList.remove('menu-open');
          });
        });
      }

      // Parse Query Params to pre-fill selections
      try {
        const params = new URLSearchParams(window.location.search);
        const tierParam = params.get('tier');
        const sourceParam = params.get('source');

        const collectionSelect = document.getElementById('collection-select');
        const budgetSelect = document.getElementById('budget-select');
        const plannerCheckbox = document.getElementById('planner-checkbox');

        if (tierParam && collectionSelect) {
          if (tierParam === 'digital') {
            collectionSelect.value = 'digital';
            if (budgetSelect) budgetSelect.value = '1600-2500';
          } else if (tierParam === 'signature') {
            collectionSelect.value = 'signature';
            if (budgetSelect) budgetSelect.value = '2500-3500';
          } else if (tierParam === 'atelier') {
            collectionSelect.value = 'atelier';
            if (budgetSelect) budgetSelect.value = '3500-5000';
          }
        }

        if (sourceParam === 'planner' && plannerCheckbox) {
          plannerCheckbox.checked = true;
        }
      } catch (e) {}
    </script>
  </body>
</html>
