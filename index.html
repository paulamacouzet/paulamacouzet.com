<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/Favicon_1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paula Macouzet</title>
    
    <!-- Open Graph Meta Tags for Social/WhatsApp Sharing -->
    <meta property="og:title" content="Paula Macouzet" />
    <meta property="og:description" content="Artistic and bespoke visual identity for destination weddings." />
    <meta property="og:image" content="https://paulamacouzet.com/images/Hero_image_main_page.png" />
    <meta property="og:url" content="https://paulamacouzet.com/" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
      /* Preloader styles */
      body { opacity: 0; transition: opacity 0.5s ease; }
      body.app-ready { opacity: 1; }
    </style>
    <script>
      // Preload large background image to prevent progressive rendering
      const bgImg = new Image();
      bgImg.src = '/images/Hero_image_main_page.png';
      bgImg.onload = () => {
        document.body.classList.add('app-ready');
      };
      // Fallback in case of error or extremely slow network
      setTimeout(() => { document.body.classList.add('app-ready'); }, 8000);
    </script>
  </head>
  <body>
    <!-- Background that will fade in -->
    <div class="bg-overlay"></div>
    <div class="background-image"></div>
    
    <div class="content fade-in-dramatic">
      <img src="/images/LOGO_LANDING_PRINCIPAL.png" alt="Paula Macouzet - Art Director, Architect, Artist" class="main-logo" />
    </div>

    <div class="subtitle-container fade-in-dramatic">
      <img src="/images/Subtitle_elevating_the_experience_hero.png" alt="Elevating the experience. Back shortly." class="subtitle-img" />
    </div>

    <!-- Bottom Right Links -->
    <div class="bottom-links fade-in-dramatic">
      <a href="https://sfumatosociety.com" target="_blank" class="text-link">Sfumato</a>
      <a href="/weddings/" class="text-link">Weddings</a>
    </div>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
